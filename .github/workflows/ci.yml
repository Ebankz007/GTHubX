name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # tsc resolves the generated Prisma client under lib/generated —
      # `postinstall: prisma generate` above produces it before lint runs.
      - name: Typecheck
        run: pnpm typecheck

      # Unit tests only (no database): the suite never touches Prisma —
      # integration coverage happens against the LIVE database via the
      # deploy pipeline's health gate and the smoke tools.
      - name: Test
        run: pnpm test
